<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Yozakura WebClickGUI</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="ambient-petals" aria-hidden="true" id="petals"></div>

    <div class="app-shell">
      <aside class="sidebar">
        <div class="brand">
          <div class="sakura-logo" aria-hidden="true">
            <span></span><span></span><span></span><span></span><span></span>
            <i></i>
          </div>
          <div class="brand-copy">
            <strong>Yozakura</strong>
            <span>WebClickGUI</span>
          </div>
        </div>

        <div class="side-section">
          <div class="side-title">Modules</div>
          <nav class="category-list" id="categoryList"></nav>
        </div>

        <div class="side-section side-configs">
          <div class="side-title">Configs</div>
          <button class="side-link muted" type="button">
            <span>⌁</span>
            <strong>Profiles</strong>
            <em>›</em>
          </button>
          <button class="side-link muted" type="button">
            <span>▣</span>
            <strong>Config Manager</strong>
            <em>›</em>
          </button>
        </div>

        <div class="side-footer">
          <button type="button" title="GitHub">⌘</button>
          <button type="button" title="Community">◈</button>
          <button type="button" title="Export">⇩</button>
        </div>
      </aside>

      <main class="workspace">
        <header class="topbar">
          <button class="icon-button menu-button" type="button" aria-label="Menu">☰</button>

          <div class="top-actions">
            <button class="icon-button" id="viewToggleButton" type="button" aria-label="View mode" aria-pressed="false">▦</button>
            <div class="connection">
              <span class="status-dot"></span>
              <div>
                <strong id="statusText">Connecting</strong>
                <span id="clientInfo">127.0.0.1</span>
              </div>
            </div>
            <button class="icon-button" id="themeToggleButton" type="button" aria-label="Theme" aria-pressed="false">☾</button>
            <button class="profile-button" type="button">
              <span class="avatar">✿</span>
              <strong id="clientName">Yozakura</strong>
              <em>⌄</em>
            </button>
          </div>
        </header>

        <section class="content detail-closed" id="content">
          <section class="module-pane">
            <div class="module-grid" id="moduleGrid">
              <div class="loading">Loading modules...</div>
            </div>
          </section>

          <aside class="detail-panel" id="detailPanel" aria-hidden="true">
            <div class="detail-head">
              <div class="detail-title-row">
                <div class="detail-icon" id="detailIcon">✦</div>
                <div>
                  <h2 id="detailName">Select a module</h2>
                  <p id="detailDesc">Choose a module to edit settings.</p>
                </div>
              </div>
              <div class="detail-head-actions">
                <button class="switch big" id="toggleButton" type="button" aria-label="Toggle module"></button>
                <button class="icon-button close-detail" id="closeDetailButton" type="button" aria-label="Close settings">×</button>
              </div>
            </div>

            <div class="detail-meta">
              <span id="detailCategory">Category</span>
              <span id="detailKey">None</span>
            </div>

            <label class="bind-row">
              <span>Bind</span>
              <input id="bindInput" type="text" placeholder="Press a key, Backspace clears" />
            </label>

            <div class="value-list" id="valueList">
              <div class="empty-state">No module selected.</div>
            </div>

            <div class="detail-actions">
              <button class="soft-button" id="prevModuleButton" type="button">‹ Previous</button>
              <button class="primary-button" id="nextModuleButton" type="button">Next ›</button>
            </div>
          </aside>
        </section>
      </main>
    </div>

    <script>
      window.__YOZAKURA_TOKEN__ = "__YOZAKURA_TOKEN_VALUE__";
      window.__YOZAKURA_PORT__ = "__YOZAKURA_PORT_VALUE__";
    </script>
    <script src="/script.js"></script>
  </body>
</html>
