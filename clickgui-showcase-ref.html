<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nether v2.1 - ClickGUI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/* ============================================================
   NETHER CLICKGUI — Layered Depth + Thick Glass Design System
   ============================================================ */

/* ===== Design Tokens ===== */
:root{
  /* Surfaces (layered elevation) */
  --bg:#15171A;
  --sidebar:#1B1D22;
  --card:#23262C;
  --card-hover:#282C33;
  --selected:#2B3038;
  --settings:#262A31;

  /* Accent */
  --accent:#8b5cf6;
  --accent-hover:#a78bfa;
  --accent-pressed:#7c3aed;
  --accent-rgb:139,92,246;
  --accent-glow:rgba(139,92,246,0.25);
  --accent-dim:rgba(139,92,246,0.12);
  --accent-gradient:linear-gradient(135deg,#8b5cf6,#a78bfa);

  /* Foreground */
  --fg:#F0F2F5;
  --fg-2:#9BA3AF;
  --fg-3:#5C6573;
  --fg-4:#3A414C;

  /* Borders */
  --border:rgba(255,255,255,0.06);
  --border-2:rgba(255,255,255,0.10);

  /* Status */
  --green:#34D399;
  --red:#F87171;

  /* Shadows */
  --shadow-ambient:0 8px 24px rgba(0,0,0,0.08);
  --shadow-hover:0 12px 32px rgba(0,0,0,0.12);
  --inner-highlight:inset 0 1px 0 rgba(255,255,255,0.04);

  /* Radius */
  --r-xs:6px;
  --r-sm:8px;
  --r-md:12px;
  --r-lg:16px;
  --r-xl:20px;
  --r-capsule:20px;

  /* Motion */
  --spring:cubic-bezier(0.22,1.2,0.36,1);
  --spring-bounce:cubic-bezier(0.34,1.56,0.64,1);
  --ease-out:cubic-bezier(0.16,1,0.3,1);
  --ease-quick:cubic-bezier(0.4,0,0.2,1);
}

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}

body{
  background:var(--bg);
  color:var(--fg);
  font-family:'Inter',system-ui,-apple-system,sans-serif;
  overflow:hidden;
  height:100vh;width:100vw;
  display:flex;align-items:center;justify-content:center;
  user-select:none;
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
}

/* ===== Scene Background ===== */
.scene-bg{
  position:fixed;inset:0;z-index:0;pointer-events:none;
  background:
    url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E"),
    linear-gradient(180deg,var(--bg) 0%,#101216 50%,var(--bg) 100%);
}
.orb{
  position:fixed;border-radius:50%;pointer-events:none;z-index:0;
  filter:blur(90px);opacity:.45;
  transition:background .4s var(--ease-out);
}
.orb-1{width:440px;height:440px;top:6%;left:10%;background:radial-gradient(circle,rgba(var(--accent-rgb),.18),transparent 70%);}
.orb-2{width:380px;height:380px;bottom:8%;right:6%;background:radial-gradient(circle,rgba(var(--accent-rgb),.12),transparent 70%);}
.orb-3{width:300px;height:300px;top:42%;left:52%;background:radial-gradient(circle,rgba(var(--accent-rgb),.08),transparent 70%);}

/* ===== Hint ===== */
.hint{
  position:fixed;z-index:50;text-align:center;
  transition:opacity .4s var(--ease-out),transform .4s var(--spring);
}
.hint.hidden{opacity:0;transform:scale(.9);pointer-events:none;}
.hint-card{
  display:inline-flex;flex-direction:column;align-items:center;gap:14px;
  padding:28px 40px;border-radius:var(--r-lg);
  background:linear-gradient(180deg,var(--card),var(--sidebar));
  border:1px solid var(--border-2);
  box-shadow:0 20px 60px rgba(0,0,0,.5),var(--inner-highlight);
}
.hint-title{
  font-family:'Bricolage Grotesque',sans-serif;
  font-size:22px;font-weight:700;letter-spacing:.3px;
  background:linear-gradient(135deg,var(--fg),var(--accent-hover));
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
}
.hint-key{
  display:inline-flex;align-items:center;gap:8px;
  padding:8px 16px;border-radius:var(--r-sm);
  background:var(--card-hover);border:1px solid var(--border-2);
  font-size:13px;color:var(--fg-2);
}
.hint-key kbd{
  padding:3px 10px;border-radius:5px;
  background:linear-gradient(180deg,var(--selected),var(--card-hover));
  border:1px solid var(--border-2);
  font-family:inherit;font-size:12px;font-weight:600;color:var(--fg);
  box-shadow:0 2px 0 rgba(0,0,0,.3),inset 0 1px 0 rgba(255,255,255,.06);
}

/* ===== Backdrop ===== */
.backdrop{
  position:fixed;inset:0;z-index:90;
  background:rgba(0,0,0,.55);
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  opacity:0;pointer-events:none;
  transition:opacity .35s var(--ease-out);
}
.backdrop.open{opacity:1;pointer-events:all;}

/* ===== GUI Container ===== */
.gui{
  position:fixed;z-index:100;
  width:min(960px,94vw);height:min(640px,88vh);
  top:50%;left:50%;
  transform:translate(-50%,-50%) scale(.92) translateY(20px);
  opacity:0;pointer-events:none;
  transition:transform .5s var(--spring-bounce),opacity .35s var(--ease-out);
  display:flex;flex-direction:column;
  border-radius:var(--r-xl);overflow:hidden;
  border:1px solid var(--border-2);
  background:var(--bg);
  box-shadow:
    0 24px 64px rgba(0,0,0,.55),
    0 8px 24px rgba(0,0,0,.3),
    var(--inner-highlight);
}
.gui.open{
  transform:translate(-50%,-50%) scale(1) translateY(0);
  opacity:1;pointer-events:all;
}
/* Top ambient light line */
.gui::before{
  content:'';position:absolute;left:0;right:0;top:0;height:1px;z-index:5;
  background:linear-gradient(90deg,transparent 10%,rgba(var(--accent-rgb),.5) 50%,transparent 90%);
  pointer-events:none;
}

/* ===== Titlebar ===== */
.titlebar{
  display:flex;align-items:center;justify-content:space-between;
  padding:12px 18px;gap:16px;
  background:linear-gradient(180deg,rgba(var(--accent-rgb),.04),transparent 40%),var(--sidebar);
  border-bottom:1px solid var(--border);
  flex-shrink:0;position:relative;
}
.titlebar::after{
  content:'';position:absolute;left:18px;right:18px;bottom:-1px;height:1px;
  background:linear-gradient(90deg,transparent,rgba(var(--accent-rgb),.3),transparent);
}
.titlebar-left{display:flex;align-items:center;gap:12px;}
.brand{display:flex;align-items:center;gap:9px;}
.brand-icon{
  width:30px;height:30px;border-radius:var(--r-sm);
  background:var(--accent-gradient);
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 4px 12px rgba(var(--accent-rgb),.4),inset 0 1px 0 rgba(255,255,255,.25);
}
.brand-icon svg{width:16px;height:16px;color:#fff;}
.brand-name{font-family:'Bricolage Grotesque',sans-serif;font-size:16px;font-weight:700;color:var(--fg);letter-spacing:.3px;}
.brand-ver{
  font-family:'JetBrains Mono',monospace;
  font-size:10px;color:var(--accent-hover);font-weight:600;
  padding:2px 7px;border-radius:5px;
  background:var(--accent-dim);border:1px solid rgba(var(--accent-rgb),.18);
}
.titlebar-right{display:flex;align-items:center;gap:6px;}
.tb-btn{
  width:32px;height:32px;border-radius:var(--r-sm);border:1px solid transparent;
  background:transparent;color:var(--fg-3);cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  transition:all .2s var(--ease-quick);
}
.tb-btn:hover{background:var(--card);color:var(--fg);border-color:var(--border);transform:scale(1.02);}
.tb-btn:active{transform:scale(.98);}
.tb-btn svg{width:16px;height:16px;}
.tb-btn.close-btn:hover{background:rgba(248,113,113,.12);color:var(--red);border-color:rgba(248,113,113,.2);}

/* ===== GUI Body ===== */
.gui-body{display:flex;flex:1;overflow:hidden;}

/* ===== Sidebar ===== */
.sidebar{
  width:220px;min-width:220px;
  background:var(--sidebar);
  border-right:1px solid var(--border);
  display:flex;flex-direction:column;
  padding:14px 10px;gap:6px;
  overflow-y:auto;position:relative;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.02);
}
.sidebar::-webkit-scrollbar{width:5px;}
.sidebar::-webkit-scrollbar-track{background:transparent;}
.sidebar::-webkit-scrollbar-thumb{background:var(--card);border-radius:3px;}
.sidebar-label{
  font-size:9px;font-weight:700;color:var(--fg-4);
  text-transform:uppercase;letter-spacing:1.2px;
  padding:4px 10px 2px;
}
.cat-nav{display:flex;flex-direction:column;gap:6px;flex:1;}

/* Capsule category buttons */
.cat-card{
  display:flex;align-items:center;gap:10px;
  padding:9px 13px;
  border-radius:var(--r-md);
  background:var(--card);
  border:1px solid var(--border);
  cursor:pointer;position:relative;
  transition:background .2s var(--ease-quick),border-color .2s var(--ease-quick),transform .25s var(--spring),box-shadow .25s var(--spring);
  box-shadow:var(--shadow-ambient),var(--inner-highlight);
}
.cat-card:hover{
  background:var(--card-hover);
  border-color:var(--border-2);
  transform:translateY(-1px);
}
.cat-card .cat-ic{
  width:18px;height:18px;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  transition:transform .3s var(--spring),color .2s;
}
.cat-card svg{width:18px;height:18px;flex-shrink:0;stroke-width:1.8;color:var(--fg-3);transition:color .2s,transform .3s var(--spring);}
.cat-card:hover .cat-ic{transform:scale(1.1);}
.cat-card:hover svg{color:var(--fg);}
.cat-card.active{
  background:linear-gradient(135deg,rgba(var(--accent-rgb),.10),rgba(var(--accent-rgb),.04));
  border-color:rgba(var(--accent-rgb),.25);
  box-shadow:0 4px 16px rgba(var(--accent-rgb),.10),var(--inner-highlight);
}
.cat-card.active svg{color:var(--accent-hover);}
.cat-card.active::before{
  content:'';position:absolute;left:-1px;top:50%;
  transform:translateY(-50%) scaleY(0);
  transform-origin:center;
  width:3px;height:60%;
  border-radius:0 3px 3px 0;
  background:var(--accent);
  animation:catBarIn .35s var(--spring) forwards;
}
@keyframes catBarIn{to{transform:translateY(-50%) scaleY(1);}}
.cat-card .cat-name{
  flex:1;font-size:12.5px;font-weight:500;color:var(--fg-3);
  transition:color .2s;white-space:nowrap;
}
.cat-card:hover .cat-name{color:var(--fg);}
.cat-card.active .cat-name{color:var(--fg);font-weight:600;}
.cat-card .cat-badge{
  font-family:'JetBrains Mono',monospace;
  font-size:9px;font-weight:700;color:var(--fg-4);
  background:rgba(255,255,255,.04);
  padding:2px 7px;border-radius:5px;
  transition:all .2s;
}
.cat-card.active .cat-badge{color:var(--accent-hover);background:var(--accent-dim);}

/* Profile card (bottom) */
.sidebar-profile{
  display:flex;align-items:center;gap:10px;
  padding:10px 12px;border-radius:var(--r-md);
  background:var(--card);border:1px solid var(--border);
  margin-top:auto;flex-shrink:0;
  box-shadow:var(--shadow-ambient),var(--inner-highlight);
  transition:all .25s var(--spring);
}
.sidebar-profile:hover{border-color:var(--border-2);transform:translateY(-1px);}
.profile-avatar{
  width:34px;height:34px;border-radius:var(--r-sm);
  background:var(--accent-gradient);
  display:flex;align-items:center;justify-content:center;
  font-family:'Bricolage Grotesque',sans-serif;
  font-size:15px;font-weight:700;color:#fff;flex-shrink:0;
  box-shadow:0 2px 8px rgba(var(--accent-rgb),.35),inset 0 1px 0 rgba(255,255,255,.25);
}
.profile-info{flex:1;min-width:0;}
.profile-name{font-size:12px;font-weight:600;color:var(--fg);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.profile-tag{
  font-family:'JetBrains Mono',monospace;
  font-size:9px;color:var(--green);font-weight:700;
  letter-spacing:.5px;margin-top:2px;
  display:inline-flex;align-items:center;gap:4px;
}
.profile-tag::before{
  content:'';width:5px;height:5px;border-radius:50%;
  background:var(--green);box-shadow:0 0 6px var(--green);
}
.profile-uid{
  font-family:'JetBrains Mono',monospace;
  font-size:10px;color:var(--fg-4);margin-top:1px;
}

/* ===== Main Panel ===== */
.main-panel{
  flex:1;display:flex;flex-direction:column;overflow:hidden;
  background:var(--bg);position:relative;
}
.main-header{padding:16px 20px 12px;flex-shrink:0;}
.main-header-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:2px;gap:12px;}
.main-title{
  font-family:'Bricolage Grotesque',sans-serif;
  font-size:18px;font-weight:700;color:var(--fg);letter-spacing:.2px;
  display:flex;align-items:center;gap:10px;
}
.main-title .title-count{
  font-family:'JetBrains Mono',monospace;
  font-size:11px;font-weight:600;color:var(--fg-3);
  padding:2px 8px;border-radius:5px;
  background:var(--card);border:1px solid var(--border);
}

/* Search box */
.search-box{position:relative;width:230px;flex-shrink:0;}
.search-box input{
  width:100%;padding:8px 30px 8px 34px;
  border-radius:var(--r-sm);border:1px solid var(--border);
  background:var(--card);color:var(--fg);
  font-family:inherit;font-size:12px;outline:none;
  transition:border-color .2s,box-shadow .2s,background .2s;
}
.search-box input::placeholder{color:var(--fg-4);}
.search-box input:focus{
  border-color:var(--accent);
  background:var(--card-hover);
  box-shadow:0 0 0 3px var(--accent-dim);
}
.search-box .search-ic{
  position:absolute;left:11px;top:50%;transform:translateY(-50%);
  width:14px;height:14px;color:var(--fg-4);transition:color .2s;pointer-events:none;
}
.search-box:focus-within .search-ic{color:var(--accent-hover);}
.search-clear{
  position:absolute;right:6px;top:50%;transform:translateY(-50%) scale(.8);
  width:18px;height:18px;border-radius:50%;border:none;
  background:var(--card-hover);color:var(--fg-3);cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  opacity:0;pointer-events:none;
  transition:opacity .2s,transform .2s var(--spring),background .2s,color .2s;
}
.search-box.has-text .search-clear{opacity:1;pointer-events:all;transform:translateY(-50%) scale(1);}
.search-clear:hover{background:var(--selected);color:var(--fg);}
.search-clear svg{width:10px;height:10px;}

/* ===== Module List ===== */
.module-list{
  flex:1;overflow-y:auto;padding:6px 20px 20px;
  scroll-behavior:smooth;
  display:flex;flex-direction:column;gap:8px;
}
.module-list::-webkit-scrollbar{width:6px;}
.module-list::-webkit-scrollbar-track{background:transparent;}
.module-list::-webkit-scrollbar-thumb{background:var(--card);border-radius:3px;}
.module-list::-webkit-scrollbar-thumb:hover{background:var(--card-hover);}

/* Module group: card + expand wrapper */
.mod-group{position:relative;}
.mod-group.expanded .mod-card{
  border-bottom-left-radius:0;
  border-bottom-right-radius:0;
}

/* ===== Module Card ===== */
.mod-card{
  display:flex;align-items:center;
  padding:0 16px;min-height:56px;
  border-radius:var(--r-md);
  background:var(--card);
  border:1px solid var(--border);
  position:relative;
  transition:background .2s var(--ease-quick),border-color .2s var(--ease-quick),transform .25s var(--spring),box-shadow .25s var(--spring);
  box-shadow:var(--shadow-ambient),var(--inner-highlight);
  cursor:default;
  animation:fadeInUp .35s var(--spring) both;
}
.mod-card:hover{
  background:var(--card-hover);
  border-color:rgba(var(--accent-rgb),.18);
  transform:translateY(-2px) scale(1.01);
  box-shadow:var(--shadow-hover),var(--inner-highlight);
}
.mod-card.enabled{
  background:linear-gradient(135deg,rgba(var(--accent-rgb),.07),transparent 70%);
  border-color:rgba(var(--accent-rgb),.18);
}
.mod-card.enabled::after{
  content:'';position:absolute;left:0;top:50%;
  transform:translateY(-50%);
  width:3px;height:62%;
  border-radius:0 3px 3px 0;
  background:var(--accent);
}
.mod-info{display:flex;align-items:center;gap:11px;flex:1;min-width:0;cursor:pointer;}
.mod-icon{
  width:36px;height:36px;border-radius:var(--r-sm);flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  background:var(--card-hover);
  border:1px solid var(--border);
  transition:all .25s var(--spring);
}
.mod-icon svg{width:17px;height:17px;color:var(--fg-3);transition:color .25s;}
.mod-card:hover .mod-icon{background:var(--selected);}
.mod-card:hover .mod-icon svg{color:var(--fg-2);}
.mod-card.enabled .mod-icon{
  background:var(--accent-dim);
  border-color:rgba(var(--accent-rgb),.22);
}
.mod-card.enabled .mod-icon svg{color:var(--accent-hover);}
.mod-text{min-width:0;flex:1;}
.mod-name{
  font-family:'Bricolage Grotesque',sans-serif;
  font-size:13px;font-weight:600;color:var(--fg);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  letter-spacing:.1px;
}
.mod-sub{display:flex;align-items:center;gap:6px;margin-top:2px;}
.mod-desc{
  font-size:11px;color:var(--fg-3);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  flex:1;min-width:0;
}
/* Keybind badge in actions area */
.bind-btn{
  width:30px;height:30px;border-radius:var(--r-sm);
  border:1px solid var(--border-2);
  background:var(--card-hover);
  display:flex;align-items:center;justify-content:center;
  flex-shrink:0;
  font-family:'JetBrains Mono',monospace;font-size:10px;font-weight:700;
  color:var(--fg-3);
  box-shadow:0 2px 6px rgba(0,0,0,.2),inset 0 1px 0 rgba(255,255,255,.02);
  transition:all .25s var(--spring);
}
.mod-card:hover .bind-btn{color:var(--fg-2);}


.mod-actions{display:flex;align-items:center;gap:8px;flex-shrink:0;margin-left:12px;}
.config-btn{
  width:30px;height:30px;border-radius:var(--r-sm);
  border:1px solid var(--border-2);
  background:var(--card-hover);color:var(--fg-3);cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  transition:all .25s var(--spring);
  box-shadow:var(--inner-highlight);
}
.config-btn:hover{
  background:var(--selected);color:var(--fg);
  border-color:var(--border-2);transform:rotate(45deg);
}
.mod-card.enabled .config-btn{
  color:var(--accent-hover);
  border-color:rgba(var(--accent-rgb),.22);
  background:rgba(var(--accent-rgb),.06);
}
.config-btn svg{width:14px;height:14px;transition:transform .3s var(--spring);}

/* ===== Toggle ===== */
.toggle{
  width:40px;height:24px;border-radius:20px;
  background:var(--card-hover);cursor:pointer;
  position:relative;transition:background .2s var(--spring),border-color .2s var(--spring),box-shadow .2s var(--spring);
  flex-shrink:0;border:1px solid var(--border-2);
  box-shadow:inset 0 1px 2px rgba(0,0,0,.25),var(--inner-highlight);
}
.toggle.on{
  background:var(--accent-gradient);
  border-color:rgba(var(--accent-rgb),.35);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.15);
}
.toggle::after{
  content:'';position:absolute;top:2px;left:2px;
  width:18px;height:18px;border-radius:50%;
  background:var(--fg-3);
  transition:transform .2s var(--spring-bounce),background .2s var(--spring),box-shadow .2s var(--spring);
  box-shadow:0 1px 3px rgba(0,0,0,.3),inset 0 1px 0 rgba(255,255,255,.1);
}
.toggle.on::after{
  transform:translateX(16px);
  background:#fff;
  box-shadow:0 1px 4px rgba(0,0,0,.3);
}

/* ===== Settings Expand Panel ===== */
.mod-expand{
  max-height:0;overflow:hidden;opacity:0;
  transition:max-height .4s var(--spring),opacity .3s var(--ease-out);
  margin:0;
}
.mod-expand.open{max-height:560px;opacity:1;}
.expand-inner{
  position:relative;
  padding:16px;
  background:var(--settings);
  border:1px solid var(--border-2);
  border-top-color:transparent;
  border-radius:0 0 var(--r-md) var(--r-md);
  margin-top:-1px;
  box-shadow:var(--shadow-ambient),var(--inner-highlight);
}
.expand-inner::before{

}
.expand-title{

}
.expand-title::before{
  content:'';width:3px;height:11px;border-radius:2px;
  background:var(--accent);
}
.expand-section{margin-bottom:16px;}
.expand-section:last-child{margin-bottom:0;}
.section-header{
  font-size:10px;font-weight:700;color:var(--fg-4);
  text-transform:uppercase;letter-spacing:1px;
  margin-bottom:10px;padding-bottom:6px;
  border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:6px;
}
.section-header::before{
  content:'';width:2px;height:9px;border-radius:1px;background:var(--fg-4);
}
.setting-row{display:flex;align-items:center;gap:8px;margin-bottom:10px;}
.setting-row:last-child{margin-bottom:0;}
.setting-label{
  font-size:12px;color:var(--fg-2);min-width:84px;font-weight:500;
}
.setting-control{flex:1;display:flex;align-items:center;gap:8px;min-width:0;}

/* ===== Custom Dropdown ===== */
.cdropdown{position:relative;min-width:140px;}
.cdropdown-trigger{
  display:flex;align-items:center;justify-content:space-between;gap:8px;
  padding:7px 11px;border-radius:var(--r-sm);
  background:var(--card-hover);border:1px solid var(--border-2);
  color:var(--fg);font-family:inherit;font-size:12px;font-weight:500;
  outline:none;cursor:pointer;width:100%;
  box-shadow:inset 0 1px 2px rgba(0,0,0,.2),var(--inner-highlight);
  transition:background .2s var(--ease-quick),border-color .2s var(--ease-quick),transform .2s var(--ease-quick),box-shadow .2s;
}
.cdropdown-trigger:hover{
  background:var(--selected);transform:translateY(-1px);
}
.cdropdown.open .cdropdown-trigger{
  border-color:var(--accent);
  box-shadow:0 0 0 3px var(--accent-dim),inset 0 1px 2px rgba(0,0,0,.2);
}
.cdropdown-trigger .cd-val{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.cdropdown-trigger .cd-arrow{
  width:10px;height:6px;flex-shrink:0;color:var(--fg-3);
  transition:transform .3s var(--spring-bounce),color .2s;
}
.cdropdown.open .cd-arrow{transform:rotate(180deg);color:var(--accent-hover);}
.cdropdown:hover .cd-arrow{color:var(--fg-2);}
.cdropdown-menu{
  position:absolute;top:calc(100% + 6px);left:0;right:0;z-index:50;
  background:var(--card);border:1px solid var(--border-2);
  border-radius:var(--r-sm);
  box-shadow:0 12px 32px rgba(0,0,0,.4);
  padding:4px;overflow:hidden;
  opacity:0;transform:translateY(-6px) scale(.96);transform-origin:top center;
  pointer-events:none;
  transition:opacity .25s var(--ease-out),transform .3s var(--spring-bounce);
}
.cdropdown.open .cdropdown-menu{
  opacity:1;transform:translateY(0) scale(1);pointer-events:all;
}
.cdropdown-option{
  padding:7px 10px 7px 16px;border-radius:var(--r-xs);
  font-size:12px;font-weight:500;color:var(--fg-2);
  cursor:pointer;position:relative;
  transition:background .18s var(--ease-out),color .18s var(--ease-out),padding .2s var(--spring);
  animation:cdOptionIn .3s var(--spring) both;
}
.cdropdown-option:hover{
  background:var(--card-hover);color:var(--fg);padding-left:18px;
}
.cdropdown-option.selected{
  color:var(--accent-hover);font-weight:600;background:var(--accent-dim);
}
.cdropdown-option.selected::before{
  content:'';position:absolute;left:5px;top:50%;transform:translateY(-50%) scaleY(0);
  width:3px;height:55%;border-radius:2px;
  background:var(--accent);
  animation:cdCheckIn .3s var(--spring-bounce) forwards;
}
@keyframes cdOptionIn{from{opacity:0;transform:translateX(-8px);}to{opacity:1;transform:translateX(0);}}
@keyframes cdCheckIn{to{transform:translateY(-50%) scaleY(1);}}
/* change pulse */
.cdropdown.pulse .cdropdown-trigger{animation:cdPulse .45s var(--spring);}
@keyframes cdPulse{
  0%{box-shadow:0 0 0 3px var(--accent-dim),inset 0 1px 2px rgba(0,0,0,.2);}
  45%{box-shadow:0 0 0 3px rgba(var(--accent-rgb),.4),inset 0 1px 2px rgba(0,0,0,.2);}
  100%{box-shadow:0 0 0 3px var(--accent-dim),inset 0 1px 2px rgba(0,0,0,.2);}
}
/* staggered options */
.cdropdown.open .cdropdown-option:nth-child(1){animation-delay:.02s;}
.cdropdown.open .cdropdown-option:nth-child(2){animation-delay:.05s;}
.cdropdown.open .cdropdown-option:nth-child(3){animation-delay:.08s;}
.cdropdown.open .cdropdown-option:nth-child(4){animation-delay:.11s;}
.cdropdown.open .cdropdown-option:nth-child(5){animation-delay:.14s;}

/* ===== Slider ===== */
.slider-wrap{flex:1;display:flex;align-items:center;gap:10px;min-width:0;}
.slider-input-wrap{position:relative;flex:1;display:flex;align-items:center;min-width:0;}
.slider{
  -webkit-appearance:none;appearance:none;
  width:100%;height:5px;border-radius:var(--r-xs);
  background:linear-gradient(to right,var(--accent) 0%,var(--accent-hover) var(--fill,50%),var(--card-hover) var(--fill,50%),var(--card-hover) 100%);
  outline:none;cursor:pointer;
  transition:height .25s var(--spring),box-shadow .25s var(--spring);
  box-shadow:inset 0 1px 2px rgba(0,0,0,.3);
}
.slider:hover{height:6px;}
.slider.dragging{
  height:6px;
  box-shadow:inset 0 1px 2px rgba(0,0,0,.3);
}
.slider::-webkit-slider-thumb{
  -webkit-appearance:none;appearance:none;
  width:16px;height:16px;border-radius:50%;
  background:#fff;cursor:pointer;
  border:2px solid var(--accent);
  box-shadow:0 2px 6px rgba(0,0,0,.3),inset 0 1px 1px rgba(255,255,255,.4);
  transition:transform .2s var(--spring-bounce),box-shadow .25s var(--spring);
}
.slider::-webkit-slider-thumb:hover{
  transform:scale(1.3);
  box-shadow:0 2px 8px rgba(0,0,0,.4),inset 0 1px 1px rgba(255,255,255,.4);
}
.slider::-webkit-slider-thumb:active{
  transform:scale(1.35);
  box-shadow:0 2px 8px rgba(0,0,0,.4),inset 0 1px 1px rgba(255,255,255,.4);
}
.slider.dragging::-webkit-slider-thumb{
  transform:scale(1.35);
  box-shadow:0 2px 8px rgba(0,0,0,.4),inset 0 1px 1px rgba(255,255,255,.4);
}
.slider::-moz-range-thumb{
  width:16px;height:16px;border-radius:50%;
  background:#fff;cursor:pointer;border:2px solid var(--accent);
  box-shadow:0 2px 6px rgba(0,0,0,.3);
  transition:transform .2s var(--spring-bounce),box-shadow .25s var(--spring);
}
/* Floating tooltip above thumb */
.slider-tooltip{
  position:absolute;top:-30px;
  transform:translateX(-50%);
  font-family:'JetBrains Mono',monospace;
  font-size:10px;font-weight:600;color:var(--fg);
  background:var(--card);border:1px solid var(--border-2);
  padding:3px 8px;border-radius:var(--r-xs);
  box-shadow:0 4px 12px rgba(0,0,0,.4),var(--inner-highlight);
  pointer-events:none;opacity:0;
  transition:opacity .2s var(--ease-out),transform .15s var(--ease-out);
  white-space:nowrap;font-variant-numeric:tabular-nums;
}
.slider-tooltip::after{
  content:'';position:absolute;left:50%;bottom:-3px;transform:translateX(-50%) rotate(45deg);
  width:6px;height:6px;background:var(--card);
  border-right:1px solid var(--border-2);border-bottom:1px solid var(--border-2);
}
.slider-input-wrap:hover .slider-tooltip,
.slider-input-wrap.dragging .slider-tooltip{opacity:1;}
.slider-val{
  font-family:'JetBrains Mono',monospace;

.palette-panel{
  position:absolute;bottom:0;left:0;right:0;

.sv-picker{

  from{opacity:0;transform:translateY(12px);}
  to{opacity:1;transform:translateY(0);}
}

/* Utility */
.hidden{display:none!important;}

  /* ========== COLOR CONVERSIONS ========== */
  function hsvToRgb(h,s,v){
    let r,g,b;
    const i=Math.floor(h*6),f=h*6-i,p=v*(1-s),q=v*(1-f*s),t=v*(1-(1-f)*s);
    switch(i%6){case 0:r=v;g=t;b=p;break;case 1:r=q;g=v;b=p;break;case 2:r=p;g=v;b=t;break;
      case 3:r=p;g=q;b=v;break;case 4:r=t;g=p;b=v;break;case 5:r=v;g=p;b=q;break;}
    return[Math.round(r*255),Math.round(g*255),Math.round(b*255)];
  }
  function rgbToHex(r,g,b){return '#'+[r,g,b].map(x=>x.toString(16).padStart(2,'0')).join('');}
  function hexToHsv(hex){
    hex=hex.replace('#','');
    if(hex.length===3)hex=hex[0]+hex[0]+hex[1]+hex[1]+hex[2]+hex[2];
    const r=parseInt(hex.substr(0,2),16)/255,g=parseInt(hex.substr(2,2),16)/255,b=parseInt(hex.substr(4,2),16)/255;
    const max=Math.max(r,g,b),min=Math.min(r,g,b),d=max-min;
    let h=0,s=max===0?0:d/max,v=max;
    if(d!==0){switch(max){case r:h=(g-b)/d+(g<b?6:0);break;case g:h=(b-r)/d+2;break;case b:h=(r-g)/d+4;break;}h/=6;}
    return[h,s,v];
  }

  function updateColorPicker(){
    const root=document.documentElement;
    const oldR = parseInt(getComputedStyle(root).getPropertyValue('--accent-rgb').split(',')[0].trim()) || 139;
    const oldG = parseInt(getComputedStyle(root).getPropertyValue('--accent-rgb').split(',')[1].trim()) || 92;
    const oldB = parseInt(getComputedStyle(root).getPropertyValue('--accent-rgb').split(',')[2].trim()) || 246;
    const [r,g,b]=hsvToRgb(cpHue,cpSat,cpVal);
    const hex=rgbToHex(r,g,b);
    // Hover / pressed variants
    const [hr,hg,hb]=hsvToRgb(cpHue,Math.max(0,cpSat-0.10),Math.min(1,cpVal+0.12));
    const [pr,pg,pb]=hsvToRgb(cpHue,cpSat,Math.max(0,cpVal-0.12));
    // Gradient end (hue-shifted)
    const [er,eg,eb]=hsvToRgb((cpHue+0.11)%1,Math.max(0.4,cpSat),cpVal);
    // SV picker background
    const [shr,shg,shb]=hsvToRgb(cpHue,1,1);
    svPicker.style.background='linear-gradient(to top,#000,transparent),linear-gradient(to right,#fff,rgb('+shr+','+shg+','+shb+'))';
    svCursor.style.left=(cpSat*100)+'%';
    svCursor.style.top=((1-cpVal)*100)+'%';
    svCursor.style.background=hex;
    hueCursor.style.top=(cpHue*100)+'%';
    colorPreview.style.background=hex;
    colorPreview.style.boxShadow='0 2px 8px rgba(0,0,0,.3),inset 0 1px 0 rgba(255,255,255,.1),0 0 16px rgba('+r+','+g+','+b+',.3)';
    hexInput.value=hex;
    presetRow.querySelectorAll('.color-preset-dot').forEach(d=>d.classList.toggle('active',d.dataset.color.toLowerCase()===hex.toLowerCase()));
    // Apply accent CSS variables
    root.style.setProperty('--accent',hex);
    root.style.setProperty('--accent-hover','rgb('+hr+','+hg+','+hb+')');
    root.style.setProperty('--accent-pressed','rgb('+pr+','+pg+','+pb+')');
    root.style.setProperty('--accent-rgb',r+','+g+','+b);
    root.style.setProperty('--accent-glow','rgba('+r+','+g+','+b+',.15)');
    root.style.setProperty('--accent-dim','rgba('+r+','+g+','+b+',.12)');
    root.style.setProperty('--accent-gradient','linear-gradient(135deg,'+hex+',rgb('+er+','+eg+','+eb+'))');
    // Update orbs
    document.querySelectorAll('.orb').forEach(o=>{o.style.background='radial-gradient(circle,rgba('+r+','+g+','+b+',.15),transparent 70%)';});
    // Sync module color settings with new accent
    document.querySelectorAll('.color-swatch.active').forEach(sw=>{
      const color = sw.dataset.color;
      if(!color) return;
      const oldHex = rgbToHex(oldR, oldG, oldB);
      if(color.toLowerCase() === oldHex.toLowerCase()){
        sw.dataset.color = hex;
        sw.style.background = hex;
        const mod = sw.dataset.module;
        const key = sw.dataset.key;
        if(mod && key && settingValues[mod]) settingValues[mod][key] = hex;
      }
    });
  }

  function renderPresets(){
    presetRow.innerHTML='';
    PRESET_COLORS.forEach(c=>{
      const d=document.createElement('div');
      d.className='color-preset-dot';
      d.style.background=c;
      d.dataset.color=c;
      d.addEventListener('click',()=>{
        const[h,s,v]=hexToHsv(c);
        cpHue=h;cpSat=s;cpVal=v;
        updateColorPicker();
      });
      presetRow.appendChild(d);
    });
  }

  /* ========== COLOR PICKER DRAG ========== */
  let svDrag=false;
  svPicker.addEventListener('mousedown',e=>{svDrag=true;updateSV(e);e.preventDefault();});
  document.addEventListener('mousemove',e=>{if(svDrag)updateSV(e);});
  document.addEventListener('mouseup',()=>{svDrag=false;});
  function updateSV(e){
    const r=svPicker.getBoundingClientRect();
    cpSat=Math.max(0,Math.min(1,(e.clientX-r.left)/r.width));
    cpVal=Math.max(0,Math.min(1,1-(e.clientY-r.top)/r.height));
    updateColorPicker();
  }

  let hueDrag=false;
  hueBar.addEventListener('mousedown',e=>{hueDrag=true;updateHue(e);e.preventDefault();});
  document.addEventListener('mousemove',e=>{if(hueDrag)updateHue(e);});
  document.addEventListener('mouseup',()=>{hueDrag=false;});
  function updateHue(e){
    const r=hueBar.getBoundingClientRect();
    cpHue=Math.max(0,Math.min(1,(e.clientY-r.top)/r.height));
    updateColorPicker();
  }

  hexInput.addEventListener('change',()=>{
    let v=hexInput.value.trim();
    if(!v.startsWith('#'))v='#'+v;
    if(/^#[0-9a-fA-F]{6}$/.test(v)){
      const[h,s,val]=hexToHsv(v);
      cpHue=h;cpSat=s;cpVal=val;
      updateColorPicker();
    }else{
      updateColorPicker();
    }
  });

  /* ========== CATEGORY NAV (CAPSULE STYLE) ========== */
  function renderCatNav(){
    catNav.innerHTML = '';
    CATEGORIES.forEach(c=>{
      const count = MODULES[c.id].length;
      const el = document.createElement('div');
      el.className = 'cat-card' + (c.id === currentCat ? ' active' : '');
      el.innerHTML =
        '<div class="cat-ic">'+c.icon+'</div>' +
        '<span class="cat-name">'+c.name+'</span>' +
        '<span class="cat-badge">'+count+'</span>';
      el.addEventListener('click', ()=>{ switchCat(c.id); });
      catNav.appendChild(el);
    });
  }

  function switchCat(id){
    currentCat = id;
    expandedModule = null;
    searchInput.value = '';
    searchBox.classList.remove('has-text');
    const cat = CATEGORIES.find(c=>c.id===id);
    const catName = cat ? cat.name : id;
    const count = MODULES[id] ? MODULES[id].length : 0;
    mainTitle.innerHTML = catName + '<span class="title-count" id="titleCount">'+count+'</span>';
    renderCatNav();
    renderModules();
  }

  /* ========== MODULES RENDER ========== */
  function renderModules(filter){
    const list = MODULES[currentCat] || [];
    const filtered = filter ? list.filter(m=>m.name.toLowerCase().includes(filter.toLowerCase())) : list;
    moduleList.innerHTML = '';

    if(filtered.length === 0){
      const empty = document.createElement('div');
      empty.style.cssText = 'text-align:center;padding:40px 20px;color:var(--fg-4);font-size:13px;';
      empty.innerHTML = '<div style="font-size:28px;margin-bottom:8px;opacity:.5;">&#128269;</div>No modules found';
      moduleList.appendChild(empty);
      return;
    }

    const catName = (CATEGORIES.find(c=>c.id===currentCat)||{}).name || currentCat;

    filtered.forEach((m,idx)=>{
      const enabled = moduleStates[m.name];
      const expanded = expandedModule === m.name;
      const hasSettings = m.settings && m.settings.length > 0;
      const status = m.status || 'Stable';

      // Card
      const card = document.createElement('div');
      card.className = 'mod-card' + (enabled ? ' enabled' : '');
      card.style.animationDelay = (idx * 35) + 'ms';
      card.innerHTML =
        '<div class="mod-info">' +
          '<div class="mod-icon">'+(MODULE_ICONS[m.name]||'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/></svg>')+'</div>' +
          '<div class="mod-text"><div class="mod-name">'+m.name+'</div><div class="mod-desc">'+m.desc+'</div></div>' +
        '</div>' +
        '<div class="mod-actions">' +
          (m.bind?'<div class="bind-btn">'+m.bind+'</div>':'') +
          (hasSettings?'<button class="config-btn" data-module="'+m.name+'" title="Settings">'+GEAR_SVG+'</button>':'') +
          '<div class="toggle'+(enabled?' on':'')+'" data-module="'+m.name+'"></div>' +
        '</div>';

      // Toggle click
      const toggle = card.querySelector('.toggle');
      toggle.addEventListener('click', (e)=>{
        e.stopPropagation();
        moduleStates[m.name] = !moduleStates[m.name];
        toggle.classList.toggle('on');
        card.classList.toggle('enabled');
        updateEnabledCount();
      });

      // Config button click — ONLY way to expand settings (left-click)
      const configBtn = card.querySelector('.config-btn');
      if(configBtn){
        configBtn.addEventListener('click', (e)=>{
          e.stopPropagation();
          toggleExpand(m.name);
        });
      }

      // Left click on info area → toggle (NOT expand)
      const modInfo = card.querySelector('.mod-info');
      modInfo.addEventListener('click', (e)=>{
        e.stopPropagation();
        moduleStates[m.name] = !moduleStates[m.name];
        toggle.classList.toggle('on');
        card.classList.toggle('enabled');
        updateEnabledCount();
      });

      // Right click to expand settings
      card.addEventListener('contextmenu', (e)=>{
        e.preventDefault();
        if(hasSettings) toggleExpand(m.name);
      });

      // Wrap card + expand in a group container
      const group = document.createElement('div');
      group.className = 'mod-group' + (expanded ? ' expanded' : '');
      group.appendChild(card);
      moduleList.appendChild(group);

      // Expand panel (inside group)
      if(hasSettings){
        const expand = document.createElement('div');
        expand.className = 'mod-expand' + (expanded ? ' open' : '');
        expand.id = 'expand-'+m.name;
        expand.innerHTML = '<div class="expand-inner">'+buildExpandContent(m)+'</div>';
        group.appendChild(expand);
        // After open transition completes, allow overflow so dropdown menus aren't clipped
        if(expanded){
          requestAnimationFrame(()=>{
            expand.style.overflow = 'visible';
          });
        }
        expand.addEventListener('transitionend', function(e){
          if(e.propertyName === 'max-height'){
            if(expand.classList.contains('open')){
              expand.style.overflow = 'visible';
            } else {
              expand.style.overflow = '';
              group.classList.remove('expanded');
            }
          }
        });
        bindExpandEvents(m, expand);
      }
    });
    updateEnabledCount();
  }

  function updateEnabledCount(){
    const count = Object.values(moduleStates).filter(v=>v).length;
    const el = document.getElementById('enabledCount');
    if(el) el.textContent = count;
  }

  function toggleExpand(name){
    const wasExpanded = expandedModule === name;

    // Close currently expanded module
    if(expandedModule){
      const prevExpand = document.getElementById('expand-'+expandedModule);
      const prevGroup = prevExpand ? prevExpand.closest('.mod-group') : null;
      if(prevExpand){
        prevExpand.style.overflow = 'hidden';
        prevExpand.classList.remove('open');
      }
      if(prevGroup) prevGroup.classList.remove('expanded');
    }

    // Open new module (unless toggling closed)
    if(!wasExpanded){
      expandedModule = name;
      const expand = document.getElementById('expand-'+name);
      const group = expand ? expand.closest('.mod-group') : null;
      if(expand){
        // Force reflow so transition fires
        void expand.offsetHeight;
        expand.classList.add('open');
        if(group) group.classList.add('expanded');
        // After open transition, allow overflow for dropdown menus
        setTimeout(()=>{
          if(expand.classList.contains('open')){
            expand.style.overflow = 'visible';
          }
        }, 420);
      }
      setTimeout(()=>{
        if(expand) expand.scrollIntoView({behavior:'smooth', block:'nearest'});
      }, 80);
    } else {
      expandedModule = null;
    }
  }

  /* ========== BUILD EXPAND CONTENT (section-based) ========== */
  function renderSettingRow(m, s){
    let html = '<div class="setting-row">';
    html += '<div class="setting-label">'+s.label+'</div>';
    html += '<div class="setting-control">';
    switch(s.type){
      case 'dropdown':{
        const curOpt = settingValues[m.name][s.id] || s.options[0];
        html += '<div class="cdropdown" data-module="'+m.name+'" data-key="'+s.id+'">';
        html += '<div class="cdropdown-trigger" tabindex="0">';
        html += '<span class="cd-val">'+curOpt+'</span>';
        html += '<svg class="cd-arrow" viewBox="0 0 10 6" fill="none"><path d="M1 1l4 4 4-4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>';
        html += '</div>';
        html += '<div class="cdropdown-menu">';
        s.options.forEach(o=>{
          const sel = (o === curOpt) ? ' selected' : '';
          html += '<div class="cdropdown-option'+sel+'" data-value="'+o+'">'+o+'</div>';
        });
        html += '</div>';
        html += '</div>';
        break;
      }
      case 'slider':{
        const val = settingValues[m.name][s.id] !== undefined ? settingValues[m.name][s.id] : s.val;
        const fillPct = ((val - s.min) / (s.max - s.min)) * 100;
        html += '<div class="slider-wrap">';
        html += '<div class="slider-input-wrap">';
        html += '<input type="range" class="slider" min="'+s.min+'" max="'+s.max+'" step="'+s.step+'" value="'+val+'" style="--fill:'+fillPct+'%" data-module="'+m.name+'" data-key="'+s.id+'">';
        html += '<div class="slider-tooltip">'+val+'</div>';
        html += '</div>';
        html += '<span class="slider-val" id="sv-'+m.name+'-'+s.id+'">'+val+'</span>';
        html += '</div>';
        break;
      }
      case 'toggle':{
        const on = settingValues[m.name][s.id];
        html += '<div class="toggle'+(on?' on':'')+'" data-module="'+m.name+'" data-key="'+s.id+'"></div>';
        break;
      }
      case 'color':{
        const cv = settingValues[m.name][s.id] || s.val;
        html += '<div class="color-row">';
        PRESET_COLORS.slice(0,8).forEach(c=>{
          html += '<div class="color-swatch'+(cv===c?' active':'')+'" style="background:'+c+'" data-module="'+m.name+'" data-key="'+s.id+'" data-color="'+c+'"></div>';
        });
        html += '<div class="color-custom" title="Custom color">';
        html += '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="12" height="12"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>';
        html += '<input type="color" value="'+cv+'" data-module="'+m.name+'" data-key="'+s.id+'">';
        html += '</div>';
        html += '</div>';
        break;
      }
    }
    html += '</div></div>';
    return html;
  }

  function buildExpandContent(m){
    const settings = m.settings;
    const hasMode = settings.some(s=>s.id==='mode');
    let sections = [];

    if(settings.length <= 2){
      sections = [{title:null, settings:settings}];
    } else if(hasMode){
      const modeSet = settings.find(s=>s.id==='mode');
      const others = settings.filter(s=>s.id!=='mode');
      const general = [modeSet, ...others.slice(0,1)];
      const advanced = others.slice(1);
      sections = [{title:'General', settings:general}];
      if(advanced.length > 0) sections.push({title:'Advanced', settings:advanced});
    } else {
      sections = [{title:'Settings', settings:settings}];
    }

    let html = '<div class="expand-title">Settings</div>';
    sections.forEach(sec=>{
      if(sec.title){
        html += '<div class="expand-section"><div class="section-header">'+sec.title+'</div>';
      }
      sec.settings.forEach(s=>{
        html += renderSettingRow(m, s);
      });
      if(sec.title) html += '</div>';
    });
    return html;
  }

  function bindExpandEvents(m, expand){
    // Custom Dropdowns (Mode)
    expand.querySelectorAll('.cdropdown').forEach(dd=>{
      const trigger = dd.querySelector('.cdropdown-trigger');
      const valEl = dd.querySelector('.cd-val');
      const options = dd.querySelectorAll('.cdropdown-option');
      const closeOthers = ()=>{
        expand.querySelectorAll('.cdropdown.open').forEach(o=>{ if(o!==dd) o.classList.remove('open'); });
      };
      trigger.addEventListener('click', e=>{
        e.stopPropagation();
        closeOthers();
        dd.classList.toggle('open');
      });
      trigger.addEventListener('keydown', e=>{
        if(e.key==='Enter'||e.key===' '){ e.preventDefault(); trigger.click(); }
      });
      options.forEach(opt=>{
        opt.addEventListener('click', e=>{
          e.stopPropagation();
          const v = opt.dataset.value;
          settingValues[m.name][dd.dataset.key] = v;
          valEl.textContent = v;
          options.forEach(o=>o.classList.remove('selected'));
          opt.classList.add('selected');
          dd.classList.remove('open');
          // pulse feedback
          dd.classList.remove('pulse');
          void dd.offsetWidth;
          dd.classList.add('pulse');
          setTimeout(()=>dd.classList.remove('pulse'), 460);
        });
      });
    });
    // close dropdowns on outside click within expand
    expand.addEventListener('click', e=>{
      if(!e.target.closest('.cdropdown')){
        expand.querySelectorAll('.cdropdown.open').forEach(dd=>dd.classList.remove('open'));
      }
    });
    // Sliders (Number)
    expand.querySelectorAll('.slider').forEach(slider=>{
      const valEl = document.getElementById('sv-'+m.name+'-'+slider.dataset.key);
      const wrap = slider.closest('.slider-input-wrap');
      const tooltip = wrap ? wrap.querySelector('.slider-tooltip') : null;
      let changeTimer = null;
      const updateFill = ()=>{
        const min = parseFloat(slider.min), max = parseFloat(slider.max);
        const pct = ((slider.value - min) / (max - min)) * 100;
        slider.style.setProperty('--fill', pct + '%');
      };
      const positionTooltip = ()=>{
        if(!tooltip) return;
        const min = parseFloat(slider.min), max = parseFloat(slider.max);
        const pct = (slider.value - min) / (max - min);
        const w = slider.offsetWidth;
        const thumb = 16;
        const pos = pct * (w - thumb) + thumb/2;
        tooltip.style.left = pos + 'px';
        tooltip.textContent = slider.value;
      };
      updateFill();
      positionTooltip();
      slider.addEventListener('input', ()=>{
        const v = slider.value;
        settingValues[m.name][slider.dataset.key] = parseFloat(v);
        if(valEl){
          valEl.textContent = v;
          valEl.classList.add('changing');
          clearTimeout(changeTimer);
          changeTimer = setTimeout(()=>valEl.classList.remove('changing'), 420);
        }
        updateFill();
        positionTooltip();
      });
      slider.addEventListener('mousedown', ()=>{
        slider.classList.add('dragging');
        if(wrap) wrap.classList.add('dragging');
        if(valEl) valEl.classList.add('changing');
        positionTooltip();
      });
      slider.addEventListener('mouseup', ()=>{
        slider.classList.remove('dragging');
        if(wrap) wrap.classList.remove('dragging');
        if(valEl){
          valEl.classList.remove('changing');
          valEl.classList.remove('bump');
          void valEl.offsetWidth;
          valEl.classList.add('bump');
          setTimeout(()=>valEl.classList.remove('bump'), 420);
        }
      });
      slider.addEventListener('mouseleave', ()=>{
        if(slider.classList.contains('dragging')){
          slider.classList.remove('dragging');
          if(wrap) wrap.classList.remove('dragging');
        }
      });
      slider.addEventListener('change', ()=>{
        clearTimeout(changeTimer);
        if(valEl) valEl.classList.remove('changing');
      });
    });
    // Toggles (inside settings)
    expand.querySelectorAll('.toggle[data-key]').forEach(tog=>{
      tog.addEventListener('click', ()=>{
        const key = tog.dataset.key;
        settingValues[m.name][key] = !settingValues[m.name][key];
        tog.classList.toggle('on');
      });
    });
    // Color swatches
    expand.querySelectorAll('.color-swatch').forEach(sw=>{
      sw.addEventListener('click', ()=>{
        const mod = sw.dataset.module;
        const key = sw.dataset.key;
        const col = sw.dataset.color;
        settingValues[mod][key] = col;
        sw.parentElement.querySelectorAll('.color-swatch').forEach(s=>s.classList.remove('active'));
        sw.classList.add('active');
        const ci = sw.parentElement.querySelector('.color-custom input');
        if(ci) ci.value = col;
      });
    });
    // Custom color picker
    expand.querySelectorAll('.color-custom input').forEach(input=>{
      input.addEventListener('input', ()=>{
        const mod = input.dataset.module;
        const key = input.dataset.key;
        settingValues[mod][key] = input.value;
        input.closest('.color-row').querySelectorAll('.color-swatch').forEach(s=>s.classList.remove('active'));
      });
    });
  }

  /* ========== GUI OPEN/CLOSE ========== */
  function openGUI(){
    if(guiOpen) return;
    guiOpen = true;
    hint.classList.add('hidden');
    backdrop.classList.add('open');
    gui.classList.add('open');
    palettePanel.classList.remove('open');
    paletteOpen = false;
    renderModules();
  }

  function closeGUI(){
    if(!guiOpen) return;
    guiOpen = false;
    gui.classList.remove('open');
    backdrop.classList.remove('open');
    palettePanel.classList.remove('open');
    paletteOpen = false;
    setTimeout(()=>{ hint.classList.remove('hidden'); }, 350);
    expandedModule = null;
  }

  /* ========== EVENTS ========== */
  // Right Shift to toggle GUI; Escape to close; Ctrl+F to focus search
  document.addEventListener('keydown', (e)=>{
    if(e.location === KeyboardEvent.DOM_KEY_LOCATION_RIGHT && e.key === 'Shift'){
      e.preventDefault();
      if(guiOpen) closeGUI(); else openGUI();
    }
    if(e.key === 'Escape' && guiOpen){
      closeGUI();
    }
    if((e.ctrlKey || e.metaKey) && (e.key === 'f' || e.key === 'F')){
      if(guiOpen){
        e.preventDefault();
        searchInput.focus();
        searchInput.select();
      }
    }
  });

  closeBtn.addEventListener('click', closeGUI);
  backdrop.addEventListener('click', closeGUI);

  // Palette toggle
  let paletteOpen = false;
  paletteBtn.addEventListener('click', ()=>{
    paletteOpen = !paletteOpen;
    palettePanel.classList.toggle('open', paletteOpen);
  });

  // Search filter + clear button
  searchInput.addEventListener('input', ()=>{
    if(searchInput.value.length > 0){
      searchBox.classList.add('has-text');
    } else {
      searchBox.classList.remove('has-text');
    }
    renderModules(searchInput.value);
  });
  searchClear.addEventListener('click', ()=>{
    searchInput.value = '';
    searchBox.classList.remove('has-text');
    renderModules();
    searchInput.focus();
  });

  // Prevent context menu globally inside GUI
  gui.addEventListener('contextmenu', (e)=>{e.preventDefault();});

  /* ========== INIT ========== */
  renderCatNav();
  renderModules();
  renderPresets();
  updateColorPicker();
})();
</script>
