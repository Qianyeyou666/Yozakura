plugins {
    id 'java'
    id 'idea'
    id 'com.github.johnrengelman.shadow' version '8.1.1'
    id 'xyz.wagyourtail.unimined' version '1.4.1'
}

group = 'gq.yozakura'
version = '1.5.1'

base {
    archivesName = 'Yozakura'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
    sourceCompatibility = JavaVersion.VERSION_1_8
    targetCompatibility = JavaVersion.VERSION_1_8
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 8
}

repositories {
    mavenCentral()
    maven {
        name = 'MinecraftForge'
        url = 'https://maven.minecraftforge.net/'
    }
    maven {
        name = 'SpongePowered'
        url = 'https://repo.spongepowered.org/maven/'
    }
    maven {
        name = 'WagYourTail Releases'
        url = 'https://maven.wagyourtail.xyz/releases'
    }
    maven {
        name = 'WagYourTail Snapshots'
        url = 'https://maven.wagyourtail.xyz/snapshots'
    }
}

configurations {
    shade
    implementation.extendsFrom(shade)
}

sourceSets {
    modern1201 {
        java {
            srcDir 'src/modern1201/java'
        }
        resources {
            srcDir 'src/modern1201/resources'
        }
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += output + compileClasspath
    }
}

dependencies {
    shade 'javazoom:jlayer:1.0.1'
    shade 'com.google.zxing:core:3.5.3'
    shade('io.github.timer-err:qml4j-core:0.2.23') {
        exclude group: 'org.mozilla', module: 'rhino'
        exclude group: 'org.ow2.asm'
    }
    shade 'org.mozilla:rhino:1.7.15'
    shade 'org.ow2.asm:asm:5.0.3'
    shade 'io.github.humbleui:skija-windows-x64:0.143.16'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'com.google.code.gson:gson:2.2.4'
}

unimined.minecraft {
    version project.minecraft_version

    mappings {
        mcp('stable', "${project.mcp_mappings}-${project.minecraft_version}")
        searge()
    }

    minecraftForge {
        loader project.forge_version
    }

    defaultRemapJar = true
}

tasks.withType(xyz.wagyourtail.unimined.api.runs.RunConfig).configureEach {
    classpath = classpath.filter { file ->
        !(file.path.contains("${File.separator}org.jetbrains${File.separator}annotations${File.separator}")
            && file.name.startsWith('annotations-'))
    }
}

processResources {
    inputs.property 'version', project.version
    inputs.property 'mcversion', project.minecraft_version
    filesMatching('mcmod.info') {
        expand 'version': project.version, 'mcversion': project.minecraft_version
    }

    def srgToMcp = file('.gradle/unimined/local/mappings/srg2mcp.srg')
    if (srgToMcp.exists()) {
        from(srgToMcp) {
            into 'yozakura'
            rename { 'srg-mcp.srg' }
        }
    }

    rename '(.+_at.cfg)', 'META-INF/$1'
}

jar {
    dependsOn tasks.named('modern1201Classes')
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from sourceSets.modern1201.output
    from {
        configurations.shade.collect { it.isDirectory() ? it : zipTree(it) }
    }
    exclude 'META-INF/*.SF'
    exclude 'META-INF/*.DSA'
    exclude 'META-INF/*.RSA'
    exclude 'META-INF/versions/**'
    manifest {
        attributes(
            'Manifest-Version': '1.0',
            'Agent-Class': 'gq.yozakura.YozakuraAttachPoint',
            'Can-Retransform-Classes': 'true',
            'FMLAT': 'yozakura_at.cfg'
        )
    }
}

shadowJar {
    archiveClassifier = 'shadow'
    configurations = [project.configurations.shade]
    exclude 'dummyThing'
    exclude 'LICENSE.txt'
    exclude 'META-INF/versions/**'
}

tasks.register('syncRuntimeJar', Copy) {
    dependsOn tasks.named('remapJar')
    from tasks.named('remapJar').flatMap { it.archiveFile }
    into layout.buildDirectory.dir('libs')
    rename { 'Yozakura.jar' }
}

tasks.register('syncObfuscationInputJar', Copy) {
    dependsOn tasks.named('remapJar')
    from tasks.named('remapJar').flatMap { it.archiveFile }
    into layout.buildDirectory.dir('obfuscation/input')
    rename { 'Yozakura-unobfuscated.jar' }
}

tasks.register('syncObfuscationClasspath', Sync) {
    from {
        sourceSets.main.compileClasspath.filter {
            it.isFile() && it.name.toLowerCase(Locale.ROOT).endsWith('.jar')
        }
    }
    into layout.buildDirectory.dir('obfuscation/zkm-libs')
    duplicatesStrategy = DuplicatesStrategy.FAIL
}

// remapJar emits SRG-named bytecode. The release obfuscator must resolve
// Minecraft overrides against the same namespace; the normal compile classpath is MCP-named.
tasks.register('syncObfuscationSrgClasspath', Sync) {
    from {
        File mcpMinecraft = sourceSets.main.compileClasspath.find {
            it.isFile() && it.name.endsWith('+fixForge-mcp-at.jar')
        }
        if (mcpMinecraft == null) {
            throw new GradleException('Could not locate the MCP Minecraft compile JAR.')
        }
        File srgMinecraft = mcpMinecraft.parentFile.listFiles().find {
            it.isFile() && it.name.endsWith('-searge.jar')
        }
        if (srgMinecraft == null) {
            throw new GradleException("Could not locate the SRG Minecraft JAR beside ${mcpMinecraft}.")
        }
        srgMinecraft
    }
    into layout.buildDirectory.dir('obfuscation/srg-libs')
}

tasks.register('prepareObfuscation') {
    dependsOn tasks.named('syncObfuscationInputJar')
    dependsOn tasks.named('syncObfuscationClasspath')
    dependsOn tasks.named('syncObfuscationSrgClasspath')
}

tasks.named('build') {
    dependsOn tasks.named('shadowJar')
    dependsOn tasks.named('syncRuntimeJar')
}

idea {
    module {
        inheritOutputDirs = true
    }
}
